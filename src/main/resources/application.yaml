spring:
  application:
    name: seat-reservation

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${DB_USERNAME:seat_user}
    password: ${DB_PASSWORD:seat_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${PORT:8080}